<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车辆数据审核 | CSDC</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/site-nav.css"><link rel="stylesheet" href="css/inspection.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js" defer></script><script src="js/supabase-config.js" defer></script><script src="js/auth.js" defer></script><script src="js/site-nav.js" defer></script><script src="js/inspection.js" defer></script></head><body><header class="site-header"><a class="brand" href="index.html"><span>CSDC<small>Community Simulated Drift Competition</small></span></a><a class="auth-nav-link" data-auth-nav href="login.html">登录 / 注册</a></header><main class="inspection-shell"><p class="eyebrow">CSDC VEHICLE INSPECTION</p><h1>车辆数据审核</h1><p class="inspection-sub">每场分站须重新申报车辆数据。车辆文件请通过指定 QQ／微信发送，网站不接收车辆文件。</p><p id="inspection-msg" class="inspection-msg" role="status" aria-live="polite" hidden></p><section class="inspection-panel"><label for="inspection-event">选择分站赛事</label><select id="inspection-event"><option value="">正在加载…</option></select><div class="inspection-identity"><div><span>参赛车手</span><strong id="inspection-driver">—</strong></div><div><span>赛季车号</span><strong id="inspection-number">—</strong></div><div><span>审核状态</span><strong id="inspection-status">—</strong></div></div></section><form id="inspection-form" class="inspection-panel"><h2>车辆技术数据</h2><p class="inspection-sub">以下五项均为必填，每项最多 200 字。</p><div id="inspection-fields"></div><section class="inspection-contacts"><h2>车检员联系方式</h2><p class="inspection-sub">请将车辆文件发送至以下指定联系人，并注明参赛昵称、赛季车号及分站名称。</p><div class="inspection-contact-grid"><div><span>QQ</span><strong id="inspection-qq">待公布</strong></div><div><span>微信</span><strong id="inspection-wechat">待公布</strong></div></div><p id="inspection-instructions" class="inspection-sub"></p></section><button id="inspection-submit" class="inspection-submit" type="submit" disabled>提交车辆数据</button></form></main><footer class="site-footer"><a class="footer-brand" href="index.html">CSDC</a><p>Community Simulated Drift Competition</p></footer></body></html>
