<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>注册 | CSDC</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js" defer></script><script src="js/supabase-config.js" defer></script><script src="js/auth.js" defer></script><link rel="stylesheet" href="css/site-nav.css">
<script src="js/site-nav.js" defer></script>
</head><body><header class="site-header"><a class="brand" href="index.html"><span>CSDC<small>Community Simulated Drift Competition</small></span></a><a class="auth-nav-link" data-auth-nav href="login.html">登录 / 注册</a></header><main class="auth-shell"><section class="auth-panel"><p class="eyebrow">JOIN CSDC</p><h1>创建账号</h1><p class="auth-lead">注册后需要验证邮箱，并等待管理员审核。账号审核通过不代表自动获得正式车手资格。</p><p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p><form id="register-form" class="auth-form"><label class="auth-field">用户名（3–24 位字母、数字、下划线）<input id="reg-username" autocomplete="username" maxlength="24" required pattern="[a-zA-Z0-9_]{3,24}"></label><label class="auth-field">显示名称<input id="reg-name" maxlength="60" autocomplete="nickname" required></label><label class="auth-field">邮箱<input id="reg-email" type="email" autocomplete="email" required></label><label class="auth-field">密码<input id="reg-password" type="password" autocomplete="new-password" minlength="8" required></label><label class="auth-field">确认密码<input id="reg-confirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="auth-submit" type="submit">注册并发送验证邮件</button></form><section class="auth-resend" aria-labelledby="resend-heading"><h2 id="resend-heading">没有收到验证邮件？</h2><p>如果注册邮件未送达，可以使用原注册邮箱重新请求验证邮件。请先检查垃圾邮件文件夹。</p><form id="resend-form" class="auth-form"><label class="auth-field">注册邮箱<input id="resend-email" type="email" autocomplete="email" required placeholder="请输入注册时使用的邮箱"></label><button id="resend-button" class="auth-submit auth-resend-button" type="submit">重新发送验证邮件</button></form><p id="resend-message" class="auth-message" role="status" aria-live="polite" hidden></p></section><p class="auth-alt">已经有账号？<a href="login.html">前往登录</a></p></section></main><footer class="site-footer"><a class="footer-brand" href="index.html">CSDC</a><p>Community Simulated Drift Competition</p></footer></body></html>
